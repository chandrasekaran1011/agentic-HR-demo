services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  portal:
    build:
      context: ..
      dockerfile: packages/portal/Dockerfile
    ports: ["3000:3000"]
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      MASTER_DATA_DIR: /app/master-data
      SEED_DATA_DIR: /app/seed-data
    depends_on:
      redis:
        condition: service_healthy
